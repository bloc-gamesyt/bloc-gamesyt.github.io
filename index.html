<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloc-games</title>

<link rel="icon" href="/load/logo.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1a1a1a;
    text-align:center;
    padding:30px;
}

header img{
    width:120px;
    border-radius:20px;
}

header h1{
    font-size:40px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px 15px;
}

details{
    background:#1b1b1b;
    border-radius:15px;
    margin-bottom:25px;
    padding:15px;
}

summary{
    cursor:pointer;
    font-size:25px;
    color:#4da3ff;
    font-weight:bold;
    padding:10px;
}

#videos,
#shorts{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:25px;
    margin-top:20px;
}

.video{
    background:#222;
    border-radius:15px;
    overflow:hidden;
}

.video iframe{
    width:100%;
    aspect-ratio:16/9;
    border:none;
}

.video h3{
    padding:15px;
    text-align:center;
    font-size:18px;
}

.loader{
    text-align:center;
    color:#aaa;
    padding:20px;
}

footer{
    background:#1a1a1a;
    padding:25px;
    text-align:center;
}

footer a{
    color:#4da3ff;
    text-decoration:none;
    margin:15px;
}
</style>

</head>

<body>

<header>

<img src="/load/logo.png">

<h1>Bloc-games</h1>

<p>Vidéos et shorts de la chaîne</p>

</header>


<div class="container">


<details open>

<summary>
Vidéos
</summary>

<div id="videos">
<div class="loader">
Chargement des vidéos...
</div>
</div>

</details>



<details>

<summary>
Shorts
</summary>

<div id="shorts">
<div class="loader">
Chargement des shorts...
</div>
</div>

</details>


</div>


<footer>

<a href="https://youtube.com/@Bloc-gamesYT" target="_blank">
YouTube
</a>

<a href="https://tiktok.com/@blocgamesyt" target="_blank">
TikTok
</a>

</footer>



<script>

function chargerFichier(fichier, emplacement){

fetch(fichier)

.then(response=>response.json())

.then(data=>{

const zone=document.getElementById(emplacement);

zone.innerHTML="";


data.forEach(video=>{

zone.innerHTML += `

<div class="video">

<iframe
src="https://www.youtube.com/embed/${video.id}"
allowfullscreen>
</iframe>

<h3>${video.titre}</h3>

</div>

`;

});


})

.catch(()=>{

document.getElementById(emplacement).innerHTML =
"Impossible de charger.";

});

}



chargerFichier("videos.json","videos");

chargerFichier("shorts.json","shorts");


</script>


</body>
</html>
