<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloc-games</title>

<link rel="icon" href="/load/logo.png">

<meta property="og:title" content="Bloc-games">
<meta property="og:image" content="/load/logo.png">

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1c1c1c;
    text-align:center;
    padding:20px;
}

header img{
    width:120px;
}

h2{
    text-align:center;
}

#videos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    padding:20px;
}

.video{
    background:#1f1f1f;
    border-radius:12px;
    overflow:hidden;
}

.video img{
    width:100%;
    display:block;
}

.video h3{
    padding:10px;
    margin:0;
    font-size:17px;
}

.video a{
    color:white;
    text-decoration:none;
}

footer{
    text-align:center;
    padding:20px;
}
</style>

</head>

<body>

<header>
<img src="/load/logo.png" alt="Bloc-games">
<h1>Bloc-games</h1>
</header>

<h2>Dernières vidéos</h2>

<div id="videos">
Chargement...
</div>

<footer>
<a href="https://youtube.com/@Bloc-gamesYT" target="_blank" style="color:white;">
Chaîne YouTube
</a>
</footer>

<script>
const API_KEY = "911885814995-ibsb9o0ke2c0puamfgtkcoj9jmutt18h.apps.googleusercontent.com";
const CHANNEL_ID = "dISkejs9Yu7xJ3Eu"

async function chargerVideos(){

const url =
`https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=12&type=video`;

try{

const reponse = await fetch(url);
const data = await reponse.json();

const videos = document.getElementById("videos");
videos.innerHTML = "";

data.items.forEach(video=>{

videos.innerHTML += `
<div class="video">

<a href="https://www.youtube.com/watch?v=${video.id.videoId}" target="_blank">

<img src="${video.snippet.thumbnails.high.url}">

<h3>${video.snippet.title}</h3>

</a>

</div>
`;

});

}catch(e){

document.getElementById("videos").innerHTML =
"Impossible de charger les vidéos.";

console.error(e);

}

}

chargerVideos();
</script>

</body>
</html>
