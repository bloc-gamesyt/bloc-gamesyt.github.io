<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloc-games</title>

<link rel="icon" href="/load/logo.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1a1a1a;
    text-align:center;
    padding:30px;
}

header img{
    width:120px;
    border-radius:20px;
}

header h1{
    font-size:40px;
}


.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:30px 0;
}


details{
    background:#1b1b1b;
    border-radius:15px;
    margin-bottom:25px;
    padding:15px;
    overflow:hidden;
}


summary{
    cursor:pointer;
    font-size:25px;
    color:#4da3ff;
    font-weight:bold;
}


.grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;

    margin-top:20px;
}


.video{

    background:#222;
    border-radius:15px;
    overflow:hidden;
    width:100%;

}


.video iframe{

    display:block;
    width:100%;
    aspect-ratio:16/9;
    border:0;

}


.video h3{

    padding:12px;
    text-align:center;
    font-size:16px;

}


.loader{

    text-align:center;
    color:#aaa;
    padding:20px;

}


footer{

    background:#1a1a1a;
    text-align:center;
    padding:25px;

}


footer a{

    color:#4da3ff;
    text-decoration:none;
    margin:15px;

}

</style>

</head>


<body>


<header>

<img src="/load/logo.png">

<h1>Bloc-games</h1>

<p>Visitez tout le contenu de la team Bloc-games, directement depuis leur site.</p>

</header>



<div class="container">


<details open>

<summary>Vidéos</summary>


<div id="videos" class="grid">

<div class="loader">
Chargement...
</div>

</div>


</details>




<details>

<summary>Shorts</summary>


<div id="shorts" class="grid">

<div class="loader">
Chargement...
</div>

</div>


</details>


</div>




<footer>

<a href="https://youtube.com/@Bloc-gamesYT">
YouTube
</a>


<a href="https://tiktok.com/@blocgamesyt">
TikTok
</a>


</footer>




<script>


function chargerVideos(fichier, emplacement){


fetch(fichier)

.then(response=>{

if(!response.ok){
throw new Error("Fichier introuvable");
}

return response.json();

})


.then(data=>{


const zone=document.getElementById(emplacement);

zone.innerHTML="";


data.forEach(video=>{


zone.innerHTML += `

<div class="video">

<iframe

src="https://www.youtube.com/embed/${video.id}"

allowfullscreen>

</iframe>


<h3>${video.titre}</h3>


</div>

`;


});


})


.catch(error=>{


document.getElementById(emplacement).innerHTML =
"Impossible de charger.";

console.error(error);


});


}



chargerVideos("videos.json","videos");

chargerVideos("shorts.json","shorts");



</script>


</body>
</html>
