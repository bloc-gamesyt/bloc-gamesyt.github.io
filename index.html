<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloc-games</title>

<link rel="icon" href="/load/logo.png">

<meta name="theme-color" content="#0d6efd">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1a1a1a;
    text-align:center;
    padding:30px;
    box-shadow:0 4px 15px rgba(0,0,0,.4);
}

header img{
    width:120px;
    border-radius:20px;
    margin-bottom:10px;
}

header h1{
    font-size:42px;
}

header p{
    color:#bdbdbd;
    margin-top:10px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px 15px;
}

h2{
    margin-bottom:20px;
    color:#4da3ff;
    text-align:center;
}

#videos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
    gap:25px;
}

.video{
    background:#1b1b1b;
    border-radius:16px;
    overflow:hidden;
    transition:.2s;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.video:hover{
    transform:translateY(-5px);
}

.video iframe{
    width:100%;
    aspect-ratio:16/9;
    border:none;
}

.video h3{
    padding:15px;
    text-align:center;
    font-size:18px;
}

footer{
    background:#1a1a1a;
    text-align:center;
    padding:25px;
    margin-top:40px;
}

footer a{
    color:#4da3ff;
    text-decoration:none;
    margin:0 15px;
    font-size:18px;
}

footer a:hover{
    text-decoration:underline;
}

.loader{
    text-align:center;
    font-size:20px;
    color:#aaa;
    margin:40px;
}
</style>

</head>

<body>

<header>

<img src="/load/logo.png" alt="Bloc-games">

<h1>Bloc-games</h1>

<p>Toutes les vidéos de la chaîne YouTube</p>

</header>

<div class="container">

<h2>📺 Toutes les vidéos</h2>

<div id="videos">
<div class="loader">
Chargement des vidéos...
</div>
</div>

</div>

<footer>

<a href="https://youtube.com/@Bloc-gamesYT" target="_blank">
YouTube
</a>

|

<a href="https://tiktok.com/@blocgamesyt" target="_blank">
TikTok
</a>

</footer>

<script>

fetch("videos.json")
.then(response => response.json())
.then(videos => {

const zone = document.getElementById("videos");

zone.innerHTML = "";

videos.forEach(video => {

let vues = video.vues || 0;

if(vues >= 1000000){
    vues = (vues / 1000000).toFixed(1) + "M";
}
else if(vues >= 1000){
    vues = (vues / 1000).toFixed(1) + "K";
}


zone.innerHTML += `

<div class="video">

<iframe
src="https://www.youtube.com/embed/${video.id}"
allowfullscreen>
</iframe>

<h3>${video.titre}</h3>

<p>
👁️ ${vues} vues
</p>

</div>

`;

});

})
.catch(error => {

console.error(error);

document.getElementById("videos").innerHTML =
"Impossible de charger les vidéos.";

});

</script>

</body>
</html>
