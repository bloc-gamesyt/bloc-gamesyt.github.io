name: Mise à jour des vidéos

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"


permissions:
  contents: write


jobs:

  update-videos:

    runs-on: ubuntu-latest


    steps:

    - name: Récupérer le dépôt
      uses: actions/checkout@v4


    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Installer yt-dlp
      run: |
        pip install yt-dlp


    - name: Mettre à jour les vidéos
      run: |
        python maj_videos.py


    - name: Mettre à jour les shorts
      run: |
        python maj_shorts.py


    - name: Sauvegarder les changements
      run: |

        git config --global user.name "github-actions"

        git config --global user.email "actions@github.com"


        git add videos.json shorts.json


        git commit -m "Mise à jour automatique des vidéos" || exit 0


        git push