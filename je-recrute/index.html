<!-- Page minimale : envoie candidature / pub directement au webhook Discord (mode: no-cors) -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test envoi Discord</title>
</head>
<body>
  <h2>Test envoi Discord</h2>

  <form id="appForm">
    <label>Pseudo Discord<br><input id="pseudo" required></label><br>
    <label>Motivation<br><textarea id="motivation" required></textarea></label><br>
    <label>Poste<br>
      <select id="poste">
        <option value="scripteur">Scripteur</option>
        <option value="animateur">Animateur</option>
        <option value="sponsors">Sponsors</option>
        <option value="dessinateur">Dessinateur</option>
        <option value="autre">Autre</option>
      </select>
    </label><br>
    <label>Disponibilités<br><input id="dispo"></label><br>
    <label><input id="agree" type="checkbox"> J'accepte</label><br>
    <button type="submit">Envoyer candidature</button>
  </form>

  <hr>

  <form id="adForm">
    <label>Image pub<br><input id="adImage" type="file" accept="image/*"></label><br>
    <label>Lien pub<br><input id="adLink" type="url"></label><br>
    <label>Studio<br><input id="adStudio"></label><br>
    <label>Contact Discord<br><input id="adContact"></label><br>
    <label><input id="agreeAd" type="checkbox"> J'accepte</label><br>
    <button type="submit">Envoyer publicité</button>
  </form>

<script>
/* CONFIG : remplace par ton webhook Discord */
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1554898994394824825/B7ho8S8BtOFS9so15xiTfcnp0YH3cQhvIl-eaXflsn1X4vF56-WMh4IbzqF-D_hQ3HA0';

/* Envoi texte simple (mode no-cors) */
async function postTextToWebhook(content) {
  // mode: 'no-cors' permet d'envoyer la requête même si Discord n'autorise pas CORS.
  // Attention : la réponse sera opaque et on ne pourra pas détecter les erreurs.
  await fetch(WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content })
  });
}

/* Envoi avec fichier (FormData) */
async function postFormToWebhook(formData) {
  await fetch(WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: formData
  });
}

/* Handler candidature */
document.getElementById('appForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pseudo = document.getElementById('pseudo').value.trim();
  const motivation = document.getElementById('motivation').value.trim();
  const poste = document.getElementById('poste').value;
  const dispo = document.getElementById('dispo').value.trim();
  const agree = document.getElementById('agree').checked;
  if (!pseudo || !motivation || !agree) {
    alert('Remplis les champs obligatoires et accepte.');
    return;
  }
  const content = `**Nouvelle candidature**\nPseudo: ${pseudo}\nPoste: ${poste}\nMotivation: ${motivation}\nDisponibilités: ${dispo || '—'}\nEnvoyé: ${new Date().toLocaleString()}`;
  try {
    await postTextToWebhook(content);
    alert('Message envoyé (le navigateur ne confirme pas l\'état à cause de CORS). Vérifie Discord.');
    e.target.reset();
  } catch (err) {
    console.error(err);
    alert('Erreur locale. Voir console.');
  }
});

/* Handler publicité (envoie image + payload_json) */
document.getElementById('adForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById('adImage');
  const link = document.getElementById('adLink').value.trim();
  const studio = document.getElementById('adStudio').value.trim();
  const contact = document.getElementById('adContact').value.trim();
  const agreeAd = document.getElementById('agreeAd').checked;
  if (!fileInput.files[0] || !link || !studio || !agreeAd) {
    alert('Image, lien, studio et consentement requis.');
    return;
  }

  const form = new FormData();
  const payload = {
    content: `**Nouvelle publicité**\nStudio: ${studio}\nLien: ${link}\nContact: ${contact || '—'}\nEnvoyé: ${new Date().toLocaleString()}`
  };
  form.append('payload_json', JSON.stringify(payload));
  form.append('file', fileInput.files[0], fileInput.files[0].name);

  try {
    await postFormToWebhook(form);
    alert('Publicité envoyée (vérifie Discord).');
    e.target.reset();
  } catch (err) {
    console.error(err);
    alert('Erreur locale. Voir console.');
  }
});
</script>
</body>
</html>
