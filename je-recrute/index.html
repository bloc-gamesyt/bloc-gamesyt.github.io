<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dongeons Faillure — Candidature & Publicité</title>
<link rel="icon" href="/load/logo.png" />
<style>
  :root{
    --bg:#07080b; --card:#0f1720; --muted:#9fbfe6; --accent:#2b9bff; --glass:rgba(255,255,255,0.03);
    --radius:12px; --maxw:980px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:linear-gradient(180deg,#05060a,var(--bg));
    color:#eaf6ff;font-family:Inter,system-ui,Arial,sans-serif;padding:20px;display:flex;justify-content:center;
  }
  .wrap{width:96%;max-width:980px}
  header{display:flex;gap:14px;align-items:center;margin-bottom:18px}
  header img{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid var(--glass)}
  header .title{line-height:1}
  header h1{font-size:20px;color:#e6f6ff}
  header p{color:var(--muted);font-size:13px;margin-top:6px}

  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:var(--radius); padding:18px; border:1px solid var(--glass); box-shadow:0 8px 30px rgba(2,6,23,0.6)}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{padding:8px 12px;border-radius:10px;cursor:pointer;background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--muted);font-weight:600}
  .tab.active{background:linear-gradient(180deg,var(--accent),#1f7fe6);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(43,155,255,0.12)}
  form{margin-top:6px}
  label{display:block;font-size:13px;color:#cfe8ff;margin-bottom:6px;font-weight:700}
  input[type="text"], input[type="url"], textarea, select, input[type="file"]{
    width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:#eaf6ff;font-size:14px;
  }
  textarea{min-height:120px;resize:vertical;padding-top:12px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (max-width:760px){ .grid{grid-template-columns:1fr} .tabs{flex-wrap:wrap} }
  .full{grid-column:1/-1}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  button{background:linear-gradient(180deg,var(--accent),#1f7fe6);color:#fff;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:800}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:#cfe8ff}
  .success{background:#073a12;border:1px solid rgba(0,255,120,0.08);color:#bfffcf;padding:12px;border-radius:10px;margin-top:12px}
  .error{background:#3b1a1a;border:1px solid rgba(255,80,80,0.08);color:#ffd6d6;padding:12px;border-radius:10px;margin-top:12px}
  .file-preview{margin-top:8px;color:var(--muted);font-size:13px}
  .preview-img{max-width:260px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);display:block;margin-top:8px}
  footer{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}
  .small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/load/logo.png" alt="Logo Dongeons Faillure">
    <div class="title">
      <h1>Dongeons Faillure — Candidature & Publicité</h1>
      <p>Les soumissions sont envoyées sur Discord.</p>
    </div>
  </header>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800;color:#dff0ff">Formulaire officiel</div>
      <div class="small">Les administrateurs reçoivent tout sur Discord</div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-app">Candidature staff</button>
      <button class="tab" id="tab-ad">Proposer une publicité</button>
    </div>

    <!-- CANDIDATURE -->
    <form id="formApp">
      <div class="grid">
        <div class="full">
          <label for="discordPseudo">Ton pseudo Discord</label>
          <input id="discordPseudo" type="text" placeholder="@exemple#1234" required />
        </div>

        <div class="full">
          <label for="motivation">Pourquoi veux-tu travailler dans ce jeu</label>
          <textarea id="motivation" placeholder="Motivation" required></textarea>
        </div>

        <div class="full">
          <label for="roleSelect">Quel rôle veux-tu avoir</label>
          <select id="roleSelect" required>
            <option value="">-- Choisir un rôle --</option>
            <option value="scripteur">Scripteur</option>
            <option value="animateur">Animateur</option>
            <option value="sponsors">Sponsors</option>
            <option value="dessinateur">Dessinateur</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div id="otherRoleWrap" class="full" style="display:none">
          <label for="otherRole">Autre : préciser</label>
          <input id="otherRole" type="text" placeholder="Précise le rôle souhaité" />
        </div>

        <div class="full">
          <label for="availability">Tes horaires de disponibilité</label>
          <input id="availability" type="text" placeholder="Ex : Lun 18:00-22:00" />
        </div>

        <div class="full">
          <label for="otherInfo">Tu veux parler d'autre chose (optionnel)</label>
          <textarea id="otherInfo" placeholder="Informations supplémentaires"></textarea>
        </div>

        <div class="full">
          <label><input id="agreeApp" type="checkbox"> J'accepte l'envoi sur Discord</label>
        </div>
      </div>

      <div class="actions">
        <button type="submit">Envoyer</button>
        <button type="button" id="resetApp" class="ghost">Réinitialiser</button>
      </div>

      <div id="appMsg"></div>
    </form>

    <!-- PUBLICITÉ -->
    <form id="formAd" style="display:none;margin-top:12px">
      <div class="grid">
        <div class="full">
          <label for="adImage">Image de la publicité</label>
          <input id="adImage" type="file" accept="image/*" />
          <div id="adImageInfo" class="file-preview">Aucune image sélectionnée</div>
        </div>

        <div class="full">
          <label for="adLink">Lien de la publicité</label>
          <input id="adLink" type="url" placeholder="https://exemple.com" />
        </div>

        <div class="full">
          <label for="adStudio">Studio / Entreprise</label>
          <input id="adStudio" type="text" placeholder="Nom du studio" />
        </div>

        <div class="full">
          <label for="adContact">Ton pseudo Discord</label>
          <input id="adContact" type="text" placeholder="@exemple#1234" />
        </div>

        <div class="full">
          <label for="adNotes">Notes</label>
          <textarea id="adNotes" placeholder="Notes supplémentaires"></textarea>
        </div>

        <div class="full">
          <label><input id="agreeAd" type="checkbox"> J'accepte l'envoi sur Discord</label>
        </div>
      </div>

      <div class="actions">
        <button type="submit">Envoyer</button>
        <button type="button" id="resetAd" class="ghost">Réinitialiser</button>
      </div>

      <div id="adMsg"></div>
    </form>
  </section>

  <footer>
    <div class="small">Les messages sont envoyés directement sur Discord.</div>
  </footer>
</div>

<script>
// === Webhook Discord fixe ===
const WEBHOOK = "https://discord.com/api/webhooks/1554898994394824825/B7ho8S8BtOFS9so15xiTfcnp0YH3cQhvIl-eaXflsn1X4vF56-WMh4IbzqF-D_hQ3HA0";

// === Envoi texte simple ===
function sendToDiscord(content) {
    const fd = new FormData();
    fd.append("content", content);

    fetch(WEBHOOK, {
        method: "POST",
        body: fd,
        mode: "no-cors"
    });
}

// === Envoi avec image ===
function sendImageToDiscord(file, content) {
    const fd = new FormData();
    fd.append("content", content);
    fd.append("file", file);

    fetch(WEBHOOK, {
        method: "POST",
        body: fd,
        mode: "no-cors"
    });
}

// === Tabs ===
document.getElementById("tab-app").onclick = () => {
    formApp.style.display = "";
    formAd.style.display = "none";
    tab-app.classList.add("active");
    tab-ad.classList.remove("active");
};

document.getElementById("tab-ad").onclick = () => {
    formAd.style.display = "";
    formApp.style.display = "none";
    tab-ad.classList.add("active");
    tab-app.classList.remove("active");
};

// === Role "Autre" ===
roleSelect.onchange = () => {
    otherRoleWrap.style.display = roleSelect.value === "autre" ? "block" : "none";
};

// === CANDIDATURE ===
formApp.onsubmit = (e) => {
    e.preventDefault();

    const pseudo = discordPseudo.value.trim();
    const motivation = motivation.value.trim();
    const role = roleSelect.value;
    const otherRole = otherRole.value.trim();
    const dispo = availability.value.trim();
    const autres = otherInfo.value.trim();

    if (!pseudo) return appMsg.innerHTML = '<div class="error">Indique ton pseudo.</div>';
    if (!motivation) return appMsg.innerHTML = '<div class="error">Explique ta motivation.</div>';
    if (!role) return appMsg.innerHTML = '<div class="error">Choisis un rôle.</div>';
    if (role === "autre" && !otherRole) return appMsg.innerHTML = '<div class="error">Précise le rôle.</div>';
    if (!agreeApp.checked) return appMsg.innerHTML = '<div class="error">Tu dois accepter.</div>';

    const poste = role === "autre" ? otherRole : role;

    const msg =
`📨 **Nouvelle candidature — Dongeons Faillure**
> **Pseudo :** ${pseudo}
> **Poste :** ${poste}
> **Motivation :** ${motivation}
> **Disponibilités :** ${dispo || "—"}
> **Autres infos :** ${autres || "—"}
> **Envoyé le :** ${new Date().toLocaleString()}`;

    sendToDiscord(msg);

    appMsg.innerHTML = '<div class="success">Candidature envoyée ✔️</div>';
    formApp.reset();
    otherRoleWrap.style.display = "none";
};

// === PUBLICITÉ ===
formAd.onsubmit = (e) => {
    e.preventDefault();

    const file = adImage.files[0];
    const link = adLink.value.trim();
    const studio = adStudio.value.trim();
    const contact = adContact.value.trim();
    const notes = adNotes.value.trim();

    if (!file) return adMsg.innerHTML = '<div class="error">Ajoute une image.</div>';
    if (!link) return adMsg.innerHTML = '<div class="error">Indique le lien.</div>';
    if (!studio) return adMsg.innerHTML = '<div class="error">Indique le studio.</div>';
    if (!agreeAd.checked) return adMsg.innerHTML = '<div class="error">Tu dois accepter.</div>';

    const msg =
`📢 **Nouvelle publicité — Dongeons Faillure**
> **Studio :** ${studio}
> **Lien :** ${link}
> **Contact :** ${contact || "—"}
> **Notes :** ${notes || "—"}
> **Envoyé le :** ${new Date().toLocaleString()}`;

    sendImageToDiscord(file, msg);

    adMsg.innerHTML = '<div class="success">Publicité envoyée ✔️</div>';
    formAd.reset();
    adImageInfo.textContent = "Aucune image sélectionnée";
};
</script>

</body>
</html>
