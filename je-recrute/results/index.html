<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Webhook Discord</title>
<style>
    body {
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    button {
        background: #5865F2;
        border: none;
        padding: 14px 22px;
        font-size: 18px;
        border-radius: 10px;
        cursor: pointer;
        color: white;
        font-weight: bold;
    }
    button:active {
        transform: scale(0.97);
    }
</style>
</head>
<body>

<button id="sendBtn">📨 Envoyer un message Discord</button>

<script>
// Ton webhook Discord (fixe)
const WEBHOOK = "https://discord.com/api/webhooks/1554911903300460556/VxGJB_3kg4HlFGW42LunSXVSxZ4Q4XTimUOhnDzw7Iu2PE7-9B_t5qlqNJfxN30rR0Ie";

// Fonction d'envoi simple
function sendToDiscord() {
    const fd = new FormData();
    fd.append("content", "🔥 **Message de test envoyé depuis la page HTML !**");

    fetch(WEBHOOK, {
        method: "POST",
        body: fd,
        mode: "no-cors"
    });

    alert("Message envoyé ✔️");
}

// Bouton
document.getElementById("sendBtn").onclick = sendToDiscord;
</script>

</body>
</html>
